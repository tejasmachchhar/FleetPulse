name: Bug report
description: Report a reproducible problem in FleetPulse
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Use **synthetic data** only. Do not attach a real database, backup, CSV, registration number, address, token, or screenshot with personal information.

        If you used **More → Feedback & Support → Report a Bug**, FleetPulse generated a report. Paste that text into the diagnostics field below after removing anything you do not want to share.
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the closest match. The in-app report uses the same categories.
      options:
        - App crashed or stopped responding
        - Incorrect calculation or mileage
        - Data missing or not saved
        - UI or layout problem
        - Navigation problem
        - Performance problem
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: Describe the problem in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, with synthetic values where needed.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Enter ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FleetPulse version
      description: versionName and versionCode if known.
      placeholder: "4.2.0 (versionCode 4)"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: build_source
    attributes:
      label: Build source
      options:
        - Release APK
        - Debug/development APK
        - Built from source
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      description: Do not select a real personal dataset for a public report.
      options:
        - Synthetic demo dataset
        - Clean data with synthetic entries
        - Minimal synthetic reproduction
        - Other (explain below)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction data
      description: If the bug is calculation-related, list only the synthetic values needed to reproduce it. Do not attach a real backup.
      placeholder: |
        Vehicle: Demo EV 1
        Usage entries: ...
        Settings: ...
        Expected: ...
        Actual: ...
  - type: textarea
    id: diagnostics
    attributes:
      label: FleetPulse-generated diagnostics (optional)
      description: Paste the previewed report from the app. It contains app/device/environment details and redacted local logs. Remove anything you do not want public.
      placeholder: |
        FleetPulse Bug Report
        Category: ...
        ...
  - type: textarea
    id: logs
    attributes:
      label: Additional logs or screenshots (optional)
      description: Redact paths, names, registration numbers, and personal notes. Omit if not needed.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have removed real personal data, secrets, backups, and keystores from this report.
          required: true
        - label: I understand this is an offline app and I should not post a security vulnerability publicly.
          required: true
