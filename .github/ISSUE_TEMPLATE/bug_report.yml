name: Bug report
description: Report a reproducible problem in FleetPulse
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. FleetPulse is offline-first, so please use **synthetic data** only.

        **Do not upload passwords, API keys, personal vehicle information, registration numbers, financial records, backups, or private logs.** Redact names, registration numbers, file paths, and any personal notes before posting.

        If you used **More → Feedback & Support → Report a Bug**, FleetPulse can prepare a report for you. Paste that text into the diagnostics field after removing anything you do not want to share.

        **Security vulnerabilities:** do not open a public issue. Use the private security link on the new-issue page.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I am using a current FleetPulse build or can reproduce this on one.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have removed real personal data, secrets, backups, and keystores from this report.
          required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the closest match. The in-app report uses the same categories.
      options:
        - App crashed or stopped responding
        - Incorrect calculation or mileage
        - Data missing or not saved
        - UI or layout problem
        - Navigation problem
        - Performance problem
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: Describe the problem in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, with synthetic values where needed.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Enter ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FleetPulse version
      description: versionName and versionCode if known.
      placeholder: "4.3.0 (versionCode 5)"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: "Android 15 (API 35)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device manufacturer and model
      placeholder: "Google Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: build_source
    attributes:
      label: Build source
      options:
        - Release APK
        - Debug/development APK
        - Built from source
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      description: Do not select a real personal dataset for a public report.
      options:
        - Synthetic demo dataset
        - Clean data with synthetic entries
        - Minimal synthetic reproduction
        - Other (explain below)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction data (optional)
      description: If the bug is calculation-related, list only the synthetic values needed to reproduce it. Do not attach a real backup.
      placeholder: |
        Vehicle: Demo EV 1
        Usage entries: ...
        Settings: ...
        Expected: ...
        Actual: ...
  - type: textarea
    id: diagnostics
    attributes:
      label: FleetPulse-generated diagnostics (optional)
      description: Paste the previewed report from the app. Remove anything you do not want public.
      placeholder: |
        FleetPulse Bug Report
        Category: ...
        ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording (optional)
      description: Drag images here only after redacting names, registration numbers, odometer values, expenses, and personal notes.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I understand opening a browser or email app is not the same as submitting a report.
          required: true
        - label: I have not included real personal data, secrets, backups, or keystores in this report.
          required: true
