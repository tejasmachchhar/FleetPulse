name: General feedback
description: Share a short note about FleetPulse
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for a short note that is not a bug report or a feature request. For problems, use the **Bug report** form; for ideas, use **Feature request** or **UI/UX improvement**.

        Don't have a GitHub account? Use **Email FleetPulse support** on the new-issue page for the address and privacy guidance, or open **More → Feedback & Support → Email Feedback & Support** in the app. The app can prepare the email for you.

        Do not include real vehicle records, registrations, odometer values, expenses, notes, backups, or secrets.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I have not included real personal data, vehicle records, or secrets.
          required: true
  - type: textarea
    id: message
    attributes:
      label: Your feedback
      description: What would you like to share?
      placeholder: A short note is enough.
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Context (optional)
      options:
        - General impression
        - Documentation
        - Accessibility
        - Privacy
        - Performance
        - Something else
  - type: input
    id: version
    attributes:
      label: FleetPulse version (optional)
      placeholder: "4.3.0 (versionCode 5)"
