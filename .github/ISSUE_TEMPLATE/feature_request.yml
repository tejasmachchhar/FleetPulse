name: Feature request
description: Suggest a focused improvement to FleetPulse
title: "[Feature]: "
labels: ["feature-request", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FleetPulse is intentionally offline-first. Please explain the user problem before proposing a solution. Do not include real vehicle records or personal data.

        If you used **More → Feedback & Support → Suggest an Improvement**, paste the app-generated report where it helps; the app already includes the category, suggestion, optional context, and only the diagnostics you approved.
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The in-app report uses the same categories.
      options:
        - New feature
        - Existing feature improvement
        - UI/UX improvement
        - Performance improvement
        - Calculation improvement
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your suggestion
      description: A short, specific description of what you would like to see.
      placeholder: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves (optional)
      description: Describe the user need or limitation, not just the requested UI.
      placeholder: When tracking ..., I cannot ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour (optional)
      description: What should the app do instead?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Vehicles
        - Quick entry
        - Usage log
        - Analysis
        - Maintenance
        - Calibration
        - Settings
        - Data management
        - Feedback & Support
        - Documentation
        - Build/CI
        - Other
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and risks (optional)
      description: Does this change calculations, storage, permissions, or privacy? Would it affect existing data?
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Mockups are welcome only if clearly labelled as mockups; do not present them as current app screenshots.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This request preserves the offline-only, no-account privacy model.
          required: true
        - label: I have not included real personal data or secrets.
          required: true
