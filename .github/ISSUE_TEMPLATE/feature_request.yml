name: Feature request
description: Suggest a focused improvement to FleetPulse
title: "[Feature]: "
labels: ["feature-request", "enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        FleetPulse is intentionally offline-first. Explain the user problem before proposing a solution. Do not include real vehicle records, registration numbers, odometer values, expenses, notes, backups, or secrets.

        For design, accessibility, navigation, or usability suggestions, use the **UI/UX improvement** form instead. For a bug, use **Bug report**.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have not included real personal data or secrets.
          required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The in-app report uses the same categories.
      options:
        - New feature
        - Existing feature improvement
        - Performance improvement
        - Calculation improvement
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your suggestion
      description: A short, specific description of what you would like to see.
      placeholder: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves (optional)
      description: Describe the user need or limitation, not just the requested UI.
      placeholder: When tracking ..., I cannot ...
  - type: textarea
    id: benefit
    attributes:
      label: Expected user benefit (optional)
      description: What becomes easier, faster, more accurate, or more private?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Vehicles
        - Quick entry
        - Usage log
        - Analysis
        - Maintenance
        - Calibration
        - Settings
        - Data management
        - Feedback & Support
        - Documentation
        - Build/CI
        - Other
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and risks (optional)
      description: Does this change calculations, storage, permissions, or privacy? Would it affect existing data?
  - type: textarea
    id: examples
    attributes:
      label: Examples, mockups, or screenshots (optional)
      description: Label mockups clearly. Do not present a mockup as a current app screenshot, and do not include personal data.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: This request preserves the offline-only, no-account privacy model.
          required: true
        - label: I have not included real personal data or secrets.
          required: true
