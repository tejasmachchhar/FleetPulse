name: Feature request
description: Suggest a focused improvement to FleetPulse
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        FleetPulse is intentionally offline-first. Please explain the user problem before proposing a solution. Do not include real vehicle records or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need or limitation, not just the requested UI.
      placeholder: When tracking ..., I cannot ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: What else could solve the problem?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Vehicles
        - Quick entry
        - Usage log
        - Analysis
        - Maintenance
        - Calibration
        - Settings
        - Data management
        - Documentation
        - Build/CI
        - Other
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and risks
      description: Does this change calculations, storage, permissions, or privacy? Would it affect existing data?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups are welcome only if clearly labelled as mockups; do not present them as current app screenshots.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This request preserves the offline-only, no-account privacy model.
          required: true
        - label: I have not included real personal data or secrets.
          required: true
